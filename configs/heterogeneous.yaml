# C3 Experiment 1 — Heterogeneous environment configuration (ENV TYPE A)
# Agents: 4 AGVs + 2 pickers.  Task mix (package-heterogeneous variant):
#   SOLO     — 1 AGV, 0 pickers (AGV can complete alone)
#   STANDARD — 1 AGV, 1 picker  (classic cooperation)
#   LARGE    — 2 AGVs, 2 pickers (recruitment cost; resource contention)
# Task-level heterogeneity opens design space for commensalism, competition,
# and neutralism to emerge alongside mutualism and parasitism.

experiment:
  name: "hetero_c3"
  type: "heterogeneous"           # ENV TYPE A per x.md
  n_seeds: 3

env:
  id: "tarware-small-4agvs-2pickers-partialobs-chg-symbiosis-v1"
  max_inactivity_steps: null       # must override env default (100)
  max_steps: 5000
  # Five-class distribution enabling all relationship types.
  # STANDARD → mutualism   HEAVY → commensalism   SOLO+PICKER_SOLO → neutralism
  # Charger contention (competition) and task-stealing (parasitism) emerge from
  # the reduced station count and multi-agent task competition.
  package_distribution:
    SOLO:        0.20
    STANDARD:    0.30
    LARGE:       0.10
    HEAVY:       0.25
    PICKER_SOLO: 0.15

training:
  timesteps: 1_000_000
  rollout_steps: 1024
  epochs: 4
  lr: 3.0e-4
  entropy_coef: 0.01
  mini_batches: 8

safety:
  low_battery_threshold: 10.0     # force charging below this level
  depletion_penalty: 5.0          # penalty if battery hits 0

symbiotic:
  w_mutualism: 2.0                # φ(+/+) — reward joint delivery
  w_commensalism: 1.5             # φ(+/0) — reward unilateral help (up from 1.0: commensalism now expressible via SOLO)
  w_competition: -1.5             # φ(-/-) — penalise mutual blocking
  w_parasitism: -0.5              # φ(+/-) — penalise exploitation
  sym_scale: 0.3                  # scale factor (C2 boundedness)
  rel_alpha: 0.05                 # EMA smoothing for relationship history
  activity_bonus: 0.0             # set >0 only for sparse-reward ablation

logging:
  checkpoint_dir: "runs/c3_hetero_pkgmix"
  log_interval: 10                # episodes between emergence metric logs
  output: "results/hetero_pkgmix_results.json"
