# C3 Experiment 2 — Homogeneous environment configuration (ENV TYPE B)
# Falsification condition: all agents same type, any agent completes any task.
# No structural capability complementarity.
#
# EXPECTED RESULT: symbiotic ≈ unclassified ≈ team (classification gives no edge).
# If symbiotic still wins here, the claim is about reward shaping, not symbiosis.

experiment:
  name: "homo_c3"
  type: "homogeneous"             # ENV TYPE B per x.md
  n_seeds: 3

env:
  id: "tarware-tiny-4agvs-0pickers-partialobs-chg-v1"   # all-AGV, no pickers
  max_inactivity_steps: null
  max_steps: 5000

training:
  timesteps: 500_000
  rollout_steps: 1024
  epochs: 4
  lr: 3.0e-4
  entropy_coef: 0.01
  mini_batches: 8

safety:
  low_battery_threshold: 10.0
  depletion_penalty: 5.0

symbiotic:
  w_mutualism: 2.0
  w_commensalism: 1.0
  w_competition: -1.5
  w_parasitism: -0.5
  sym_scale: 0.3
  rel_alpha: 0.05
  activity_bonus: 0.0

logging:
  checkpoint_dir: "runs/c3_homo"
  log_interval: 10
  output: "results/homo_results.json"
