# PRISM — Symbiotic reward condition config
#
# Team: 4 AGVs + 2 pickers (mixed, capability-complementary)
# Reward: r_i = r_task_i + r_sym_i
#   r_sym shaped by ecological relationship type per AGV-picker pair
#
# Compare against prism_flat_cooperative.yaml which uses the same team and
# env with r_i = r_task_i + alpha_collab * mean_j(r_task_j).

experiment:
  name: "prism_symbiotic"
  condition: "symbiotic"
  n_seeds: 3

env:
  id: "tarware-small-4agvs-2pickers-partialobs-chg-v1"
  max_inactivity_steps: null        # disable early termination for training
  max_steps: 1000
  # Package mix enabling all five ecological relationship types:
  #   SOLO / PICKER_SOLO → neutralism   (independent tasks)
  #   STANDARD           → mutualism    (AGV + picker joint delivery)
  #   LARGE              → mutualism    (2 AGVs + 2 pickers, recruitment cost)
  #   HEAVY              → commensalism (picker assists AGV, AGV gains energy discount)
  #   Charger contention → competition  (from reduced station count)
  package_distribution:
    SOLO:        0.20
    STANDARD:    0.30
    LARGE:       0.10
    HEAVY:       0.25
    PICKER_SOLO: 0.15

training:
  timesteps: 1_000_000
  rollout_steps: 1024
  epochs: 4
  lr: 3.0e-4
  entropy_coef: 0.08
  mini_batches: 8

safety:
  low_battery_threshold: 7.0    # force charging below this level (was 10.0)
  depletion_penalty: 1.5        # match flat-coop so only reward structure differs

symbiotic:
  w_mutualism:    2.0           # φ(+/+) — 0.25/pair with 8 pairs; calibrated to task reward
  w_commensalism: 1.5           # φ(+/0) — reward unilateral help
  w_competition: -1.5           # φ(-/-) — penalise mutual blocking
  w_parasitism:  -0.5           # φ(+/-) — penalise exploitation
  w_coverage:     0.5           # shared bonus per delivery of ANY package type

logging:
  checkpoint_dir: "runs/prism_symbiotic"
  tb_logdir: "runs/tensorboard/prism_symbiotic"
  log_interval: 10
  output: "runs/results/prism_symbiotic.json"
